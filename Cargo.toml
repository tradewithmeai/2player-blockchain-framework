[workspace]
members = [
    "programs/skill_treasury",
    "programs/skill_escrow",
    "programs/ttt_onchain"
]

resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Skill Gaming Contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/yourusername/2player-blockchain-framework"
homepage = "https://github.com/yourusername/2player-blockchain-framework"
documentation = "https://docs.rs/skill-gaming"

[workspace.metadata.docs.rs]
# Configuration for docs.rs builds
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
