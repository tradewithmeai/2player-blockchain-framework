[package]
name = "ttt_onchain"
version = "0.1.0"
description = "On-chain Tic-Tac-Toe game logic with trustless settlement"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "ttt_onchain"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
solana-program = "1.18.22"
skill_escrow = { path = "../skill_escrow", features = ["cpi"] }
